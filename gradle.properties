org.gradle.daemon=true
org.gradle.jvmargs=-Xms256m -Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# The version published to Maven Central. On develop it ends with -SNAPSHOT; a release branch sets the final number.
version=2.5.0-SNAPSHOT
group=io.github.javakhanstudio

gdxVersion=1.14.2
# The LWJGL under gdx-backend-lwjgl3 (shots): gdx 1.14.2 brings 3.3.3, which knows JNI up to JDK 21 and warns
# "Unsupported JNI version" on JDK 25 (r163). 3.3.6 is also what jME brings. Its GLFW 3.4 would open a native Wayland
# window: ParallaxShots keeps X11 (keepX11).
lwjglVersion=3.3.6
kryoVersion=5.6.2
jacksonVersion=2.22.2
gwtVersion=2.11.0
junitVersion=6.1.3
# engines/jme only: the jMonkeyEngine reader (r112).
jmeVersion=3.9.0-stable
