plugins {
    id 'application'
}

// The reference renderer (r130): stills of a round's scenes drawn by core through libGDX, the frames the Godot and jME
// readers are compared with (tools/parallax-lab-shots.sh). Split out of the demo's ParallaxLab --shots so that this
// repository checks its readers without demo/ (docs/repo-split.md). Not published.

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = []
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'jks.tools2d.parallax.shots.ParallaxShots'
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

// ./gradlew :shots:run --args="ROUND_DIR OUT_DIR", from the root as tools/parallax-lab-shots.sh runs it (a round names
// its pages from there). It opens a window while it draws: an agent's goes to cage.
tasks.named('run', JavaExec) {
    workingDir = rootDir
    rootProject.offscreen(it)
}
