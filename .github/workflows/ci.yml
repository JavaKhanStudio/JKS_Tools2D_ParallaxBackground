name: CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      break:
        description: 'BREAK for the jME frames (scroll: its negative control, must fail)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Run the core tests in Chrome
        run: tools/browser-test.sh

      # A tools/*.sh that opens a window runs it in cage, or says why not (r171).
      - name: Check no script opens a window outside cage
        run: tools/offscreen-lint.sh && tools/offscreen-lint-test.sh

      # The readers' dashboard says Failing, Stale, Healthy as its checks left them (parallax-readers:r17).
      - name: Check the readers' dashboard verdicts
        run: python3 tools/readers-health/health_test.py

      # ruff, shellcheck and gdlint at pinned versions: a rule cleaned once and gated by nothing came back (r314).
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Lint Python, shell and GDScript
        run: tools/lint.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jdk${{ matrix.java }}
          path: '**/build/reports/tests/'
          retention-days: 7

  godot-frames:
    # engines/godot draws what core draws: engines/godot/tools/frame-check.sh renders the rounds in engines/rounds with
    # libGDX and Godot and fails on a frame that differs (r96). Here on Xvfb and Mesa llvmpipe instead of cage and a GPU.
    name: Godot frames against libGDX
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.3-stable

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb, Mesa and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0 python3-pil

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Compare the frames
        env:
          ATELIER_NO_OFFSCREEN: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          xvfb-run -a -s "-screen 0 1920x1440x24" engines/godot/tools/frame-check.sh
          grep -h "Using Device" build/godot/*/godot.log

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-frames
          path: |
            build/godot/*/compare.png
            build/godot/*/report.txt
            build/godot/*/*.log
            build/godot/*/gdx/lab.log
            build/godot/particles/godot/*.png
          retention-days: 7

  jme-frames:
    # engines/jme draws what core draws: engines/jme/tools/frame-check.sh renders the same rounds with libGDX and jME (r115).
    # No Godot here. A manual run's break input is its negative control: BREAK=scroll must fail it.
    name: jME frames against libGDX
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Xvfb, Mesa and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0 python3-pil

      - name: Compare the frames
        env:
          ATELIER_NO_OFFSCREEN: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          BREAK: ${{ inputs.break }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1440x24" engines/jme/tools/frame-check.sh
          grep -h -i "renderer" build/jme/*/jme.log | sort -u || true

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jme-frames
          path: |
            build/jme/*/compare.png
            build/jme/*/report.txt
            build/jme/*/*.log
            build/jme/*/gdx/lab.log
          retention-days: 7
