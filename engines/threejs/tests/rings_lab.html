<!doctype html>
<!-- The rings lab (parallax-readers r48): a page as the sky of a 3D world, by PlaxRings. engines/threejs/tools/rings-lab.sh opens it. -->
<html><head><meta charset="utf-8"><title>Rings lab: a page round a 3D world</title><link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 13px system-ui, sans-serif; color: #ddd; }
  #stage { position: absolute; inset: 0 0 0 300px; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #controls { position: absolute; left: 0; top: 0; bottom: 0; width: 300px; box-sizing: border-box; padding: 10px 12px;
    overflow-y: auto; background: #1b1b1f; border-right: 1px solid #333; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chips button { background: #2a2a30; color: #ccc; border: 1px solid #444; border-radius: 12px; padding: 3px 9px; cursor: pointer; font: inherit; }
  .chips button.on { background: #3d6fd8; border-color: #3d6fd8; color: #fff; }
  h3 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a8a95; }
  label { display: grid; grid-template-columns: 92px 1fr 50px; align-items: center; gap: 6px; margin: 3px 0; }
  label span.v { text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row button { flex: 1; background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 5px; cursor: pointer; font: inherit; }
  #about { color: #9a9aa5; font-size: 12px; line-height: 1.35; margin: 4px 0 8px; }
  .tag { position: absolute; padding: 3px 8px; background: rgba(0,0,0,.55); color: #fff; border-radius: 4px; font-size: 13px; pointer-events: none; }
  #settings { display: none; width: 100%; box-sizing: border-box; margin-top: 6px; background: #111; color: #cfc; border: 1px solid #444; font: 11px monospace; }
  #numbers { color: #9a9aa5; font-size: 11px; line-height: 1.4; white-space: pre-wrap; margin-top: 8px; }
</style>
</head><body>
<div id="controls">
  <div class="chips" id="views"></div>
  <div class="chips" id="scenes"></div>
  <div id="about"></div>
  <div id="sliders"></div>
  <div class="row"><button id="play">Pause</button><button id="fade">Fade to next page</button><button id="copy">Copy settings</button></div>
  <textarea id="settings" rows="10" readonly></textarea>
  <div id="numbers"></div>
</div>
<div id="stage"></div>
<script type="module" src="./rings_lab.js"></script>
</body></html>
