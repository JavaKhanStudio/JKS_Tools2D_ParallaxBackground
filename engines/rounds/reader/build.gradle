plugins {
    id 'java-library'
}

// :rounds, a reader round's round.json read once (r312), for the Java frame runners: :shots (the libGDX stills) and
// :jme's shots source set. Beside the rounds it reads (engines/rounds, a home no reader owns, parallax-readers r9).
// gdx core and :core only: no backend, so no LWJGL beside jME's. Not published.

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = []
    }
}

dependencies {
    api project(':core')
}

// The rings round's reference numbers (parallax-readers r47): core's ParallaxRings for each scene of a rings round,
// OUT/gdx/<id>.json. No window, no GL. ./gradlew :rounds:rings -Pround=engines/rounds/rings -Pout=build/rings
tasks.register('rings', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'jks.tools2d.parallax.rounds.RingsRound'
    workingDir = rootProject.projectDir
    rootProject.headless(it)
    args = [project.findProperty('round') ?: 'engines/rounds/rings', project.findProperty('out') ?: 'build/rings']
}
