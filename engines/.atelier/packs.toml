# Parallax readers's TAGS AND THEIR CONTEXT PACKS: split off board 'parallax' on 2026-10-11 (r317).
# Only [tags.<slug>] tables belong in this file.

[tags.readers]
label = "Readers"
description = "Each engine's reader (libGDX core, jME, Godot, three.js, later Unity) as its own sub project: folder layout, build, tests, CI job, release artifact (r1, ex parallax:r317). Work inside one reader goes to its own tag (#jme, #godot, #threejs, #readers-health for the dashboard, r29); #readers keeps what spans them: the layout, a new reader, the shared rounds and stills. How a page scrolls, fades or shades in a reader stays on parallax (#runtime, #shader, #format)"
color = "#c9a0ff"
sort = 60
context = """
WORK INSIDE ONE READER is tagged #jme, #godot, #threejs or #readers-health (the dashboard), each with its own pack (r29); this
tag is for what spans readers.
A READER draws a saved page in one engine. Today, in this one repository:
  core/          libGDX, the reference: parallax-background on Maven Central. Every other reader is checked against it.
  engines/jme/   :jme. src/ is published as parallax-background-jme, with core's version; tests/ holds the frame runner and demo.
                 It runs core's ParallaxPageReader as is, through JmeBatch.
  engines/godot/ a Godot 4 project. addons/jks_parallax is a GDScript port of core, line for line. release.yml attaches
                 jks-parallax-godot-X.Y.Z.zip from 2.5.0 on; the Asset Library listing is parallax:r104 (paused).
  engines/threejs/ src/plax.js, an ES module port of core for three.js (r34, from Crypto en visuel's lib/plax.js); its
                 frame runner is a page in headless Chrome. release.yml attaches jks-parallax-threejs-X.Y.Z.zip.
                 It ports every layer kind (IMAGE, EMPTY, SEQUENCE, SHADER, PARTICLES, FLOOR, LURKER), the animated patch,
                 the dolly, towers, planets, the page fog, cross-fades with their styles and tints; MIRROR, the glint and
                 detail levels are a queued #threejs task (r44).
  Unity: parallax:r103 (paused). No Unity or dotnet is installed on this machine.
EACH READER'S FOLDER holds its README.md (what it is, how a game gets it, its checks and demo) and its own scripts in
engines/<reader>/tools/ (r11): godot's frame-check.sh, bench.sh, addon-zip.sh, addon-zip-check.sh; jme's frame-check.sh, bench.sh and probe/;
threejs's frame-check.sh, bench.sh, run-page.sh, serve.py, zip.sh.
Each script cd's to the repository root first, so it runs from anywhere. Scripts every reader shares stay in tools/
(parallax-lab-shots.sh, shots-out.sh, compare-parallax-frames.py, nested-x.sh). tools/offscreen-lint.sh reads
engines/*/tools/*.sh too: a new reader's script that opens a window runs it in cage.
HEALTH (r17): tools/readers-health.sh builds build/readers-health/index.html from what the checks left (report.txt, JUnit,
CI through gh, build/bench/<reader>.json); --run runs them first; --serve 8797 is the board's Site button. A new reader is an entry in tools/readers-health/health.py's
READERS. engines/rounds/bench is timed (tools/parallax-bench.sh), never compared: no frame check plays it.
FEATURES (r28): engines/rounds/features.json maps each runtime feature to the scenes that check it (and its *Cases);
the dashboard's feature table judges it per reader from them. A new feature or scene goes there, never in round.json,
which make_round.py scripts rewrite. A reader's 'unsupported' entry in health.py names the round, its task and the feature.
A MUTANT RUN (r26) never lands in build/<reader>/<round>: tools/shots-out.sh links a frame check run under BREAK,
PLAX_MUTANT=1 or a tools/*/mutate.sh at build/<reader>/.mutant/<round>, so the dashboard keeps the last clean verdict.
A mutate.sh that reads the stills it just made reads build/<reader>/.mutant/<round> (r277, r397 do).
REFS: a bare rNN on this board is a parallax-readers task; the mother board's are written parallax:rNN
(atelier --project parallax show rNN). Mother r317 is this board's r1.
SIMON'S LAYOUT (r1, ex parallax:r317, 11 Oct): ONE repository, each reader a sub project under engines/<reader>/ with its own build,
tests, README, CI job and release artifact. The mother board stays "parallax". He also wrote, on parallax:r312, that "JMonkey and
libGDX should be 2 different repos". The later, explicit pick is one repository: confirm with him before creating
any GitHub repository.
SHARED BY EVERY READER'S CHECK: the rounds in core/test-data and engines/rounds (a home no reader owns, r9), and the libGDX stills that :shots
(shots/, ParallaxShots) draws from them. engines/<reader>/tools/frame-check.sh compares each reader with those stills;
CI runs each in its own job, godot-frames, jme-frames and threejs-frames (r10). The round file is read three times: by
Round (:rounds, engines/rounds/reader, parallax:r312) for ParallaxShots and JmeParallaxShots, by Godot's tests/shots.gd and by
three.js's tests/shots.js. A new round field goes in all three, and in each runner that plays it.
THE RINGS ROUND (r47), engines/rounds/rings, has no stills: core's ParallaxRings numbers (a page round a 3D world,
docs/page-as-3d-sky.md) per scene, written by ./gradlew :rounds:rings (RingsRound, OUT/gdx/<id>.json); a 3D reader writes
OUT/<reader>/<id>.json and tools/compare-rings.py ROUND OUT <reader> judges it (1e-4). Round, shots.gd and shots.js never read it.
What each port must copy line for line, and which frame round proves it, is in AGENTS.md "Runtime".
WHAT A NEW READER MUST HAVE (folder, README, frame check, CI job, release artifact, AGENTS.md duties) is
engines/README.md, "What a new reader must have" (r12): follow it, and change it when a reader changes the shape.
Build rules are the #build pack's: versions in gradle.properties, repositories only in settings.gradle, every JavaExec
offscreen or headless.
"""

# #readers divided by reader (r29): a tag is leased to one session at a time, so each reader's
# folder gets its own tag and the readers' tickets run side by side. #readers keeps what spans them:
# the layout, a new reader, the shared rounds and stills, the cross-reader CI shape.

[tags.jme]
label = "jME reader"
description = "The jMonkeyEngine reader in engines/jme (:jme): JmeBatch, PlaxBackground, its frame check, bench and demo. What spans readers stays #readers"
color = "#7fb3ff"
sort = 61
context = """
engines/jme/ is :jme, the jMonkeyEngine READER. src/ (jks.tools2d.parallax.jme: PlaxBackground, JmeBatch, JmeAtlas,
JmeGradient, JmeLayerEffects) is published as parallax-background-jme with core's version. It runs core's
ParallaxPageReader and WholePage_Model AS IS, drawing through JmeBatch, a libGDX Batch over jME: a libGDX call JmeBatch
does not implement throws unsupported(). tests/ holds JmeParallaxShots (the frame runner) and the demo.
Its scripts are engines/jme/tools/: frame-check.sh (ROUNDS it plays, compared with core's libGDX stills), bench.sh
(build/bench/jme.json) and probe/. Each cd's to the repository root first; every window runs offscreen/in cage
(tools/offscreen-lint.sh reads engines/*/tools/*.sh). CI job: jme-frames in .github/workflows/ci.yml.
THE REFERENCE is core/ (libGDX): rounds live in core/test-data and engines/rounds (no reader owns them), read by Round
(:rounds, engines/rounds/reader) for both ParallaxShots and JmeParallaxShots. A new round field goes in Round AND in Godot's
tests/shots.gd. A new feature or scene goes in engines/rounds/features.json, never round.json.
A MUTANT RUN (BREAK, PLAX_MUTANT=1 or a tools/*/mutate.sh) lands in build/jme/.mutant/<round> via tools/shots-out.sh,
never build/jme/<round>. A pixel round's effect must outweigh the 2/255 tolerance (measure effect vs plain).
PARTICLES are compared by pixels (engines/rounds/particles): Round.seedRandom seeds MathUtils.random per scene in
ParallaxShots and JmeParallaxShots, so a random call one runner makes and the other does not moves every flake. Small
effects gate on the round's "pixelsOff" (tools/compare-parallax-frames.py), not the mean.
When jME gains or loses a feature: its 'unsupported' entry in tools/readers-health/health.py, engines/jme/README.md
and docs/other-engines.md change with it.
Build rules (#build): versions in gradle.properties, repositories only in settings.gradle, every JavaExec offscreen or headless.
A bare rNN is a parallax-readers task; the mother board's are parallax:rNN.
"""

[tags.godot]
label = "Godot reader"
description = "The Godot 4 reader in engines/godot: addons/jks_parallax (GDScript port of core), its tests, frame check, bench, addon zip, and the mutate.sh scripts that break it. What spans readers stays #readers"
color = "#6fd6a0"
sort = 62
context = """
engines/godot/ is a Godot 4 project. addons/jks_parallax is a GDScript port of core/ (libGDX, the reference), LINE FOR
LINE: what each port must copy and which frame round proves it is in AGENTS.md "Runtime". release.yml attaches
jks-parallax-godot-X.Y.Z.zip from 2.5.0 on (addon-zip.sh, checked by addon-zip-check.sh); the Asset Library listing is
parallax:r104 (paused). tests/: shots.gd (the frame runner; reads the round file itself, so a new round field goes there
AND in Round, :rounds), particles.gd (checks particles by where they are), bench.gd, sequence_cycle.gd, demo.
Scripts are engines/godot/tools/: frame-check.sh (compares with core's libGDX stills), bench.sh (build/bench/godot.json),
addon-zip.sh, addon-zip-check.sh. Each cd's to the repository root first; every window runs headless/in cage
(tools/offscreen-lint.sh reads engines/*/tools/*.sh). CI job: godot-frames in .github/workflows/ci.yml.
Rounds live in core/test-data and engines/rounds (no reader owns them); a new feature or scene goes in
engines/rounds/features.json, never round.json (make_round.py rewrites it).
MUTATE SCRIPTS: many tools/r<NNN>-*/mutate.sh sed a line of addons/jks_parallax/*.gd and expect the frame check to FAIL.
They grep the exact line they edit: a port change silently breaks them ("mutation N did not apply"). A mutant run lands in
build/godot/.mutant/<round> via tools/shots-out.sh, never build/godot/<round>; a mutate.sh reading its own stills reads
.mutant/. Never edit a mutate.sh while it runs. Re-run the mutate.sh of the round you touch.
COLOURS AS libGDX PACKS THEM (Color.toFloatBits): the gradients cut to 8 bits (r46), a layer's alpha to 254 levels and
its tint to 8 bits (PlaxEffects.packed_alpha, packed_rgb; r51, r52), but through libGDX's page fog shader
(PlaxEffects.page_fogged) the tint stays a float and the haze is cut. Fed floats, cross-fades were off by up to 3/255;
proofs: engines/godot/tools/r51-alpha-packing and r52-tint-packing (mutate.sh, thin but repeatable margins).
plax_background.gd sits at gdlint's 1000-line cap: put new helpers in the plax_*.gd beside it.
A bare rNN is a parallax-readers task; the mother board's are parallax:rNN.
"""

[tags.threejs]
label = "three.js reader"
description = "The three.js reader in engines/threejs: src/plax.js (ES module port of core), its browser runners (tests/shots.js, bench.js), frame check, bench and release zip. What spans readers stays #readers"
color = "#7fb2ff"
sort = 64
context = """
engines/threejs/src/plax.js is an ES module port of core/ (libGDX, the reference) for three.js r170+, written from the Godot
port (engines/godot/addons/jks_parallax), which copies core LINE FOR LINE: port from the matching .gd file, keep its names
(camelCase) and order, and AGENTS.md "Runtime" says which round proves each piece. It draws each layer as a Group of
quads (class Quads, SpriteBatch: one Mesh per run of one texture, a texture switch starts the next run, so draw order
holds) in its own OrthographicCamera, in screen pixels, y down. A ported .gd class of statics (PlaxSequence) is a plain
object of functions there; a new one's check that has no stills is a page too (tests/sequence_cycle.html, run by
frame-check.sh with its round).
COLOURS ARE LIBGDX'S: textures decoded with createImageBitmap(premultiplyAlpha 'none', colorSpaceConversion 'none'),
NoColorSpace, the renderer's output LinearSRGBColorSpace while it draws: no colour management anywhere. Blending is
SRC_ALPHA, ONE_MINUS_SRC_ALPHA on the colour and ONE, ONE_MINUS_SRC_ALPHA on the alpha: an alpha left under 1 in the
drawing buffer is un-premultiplied by toBlob and the compositor, and brightened every half-transparent texel (r34: c07
read 4.6 / 255 before the fix, 0.00 after). A new material keeps both rules: spread LAYER_BLENDING into it; a
ShaderMaterial without three's colorspace chunk is already raw. libGDX packs a vertex colour to 8 bits TRUNCATED
(Color.toFloatBits): the gradients are cut so (packed()), or every still is off by 1 (r39: 0.95 -> 0.00); a layer's
tint too, its alpha to 254 levels (packedAlpha()), and under the page fog the haze, not the tint (_drawLayer, r45:
cross-fades 0.26 -> 0.00). A dissolve or a grade (PlaxTransfertStyle, r40) gives a layer with no shader the PLAIN one
(l.dissolvePlain) and _unmask takes it off: libGDX has no page fog's shader then (_pageFog). Mind
THREE.Vector4() is (0, 0, 0, 1): a uniform meant 0 is new Vector4(0, 0, 0, 0) (r39: grade.a 1 drew every effect black).
THE RUNNER is a page: tests/shots.html?round=<dir> (shots.js) steps the scroll as ParallaxShots and POSTs each still to
tools/serve.py, which serves the repository root; tools/run-page.sh opens it in headless Chrome with tools/browser.py's
GL flags (the GPU here, SwiftShader on CI) and waits for its POST done. shots.js parses round.json itself: a new round
field goes in Round (:rounds), shots.gd AND shots.js. tests/vendor/three is three.js r170 (MIT), for the tests only: a
game brings its own three.
Scripts are engines/threejs/tools/: frame-check.sh (default ROUNDS = the rounds it ports, SKIP = a round's scenes it
does not draw yet, by task; BREAK=scroll must FAIL), mutate-effects.sh (each effect broken in turn must FAIL),
bench.sh (build/bench/threejs.json; skips a bench scene whose kinds it does not port), zip.sh (the release zip).
A kind it does not port throws in readPage (KINDS): port it, add it to KINDS, add its round to frame-check.sh's ROUNDS and
drop its 'unsupported' entry in tools/readers-health/health.py. CI job: threejs-frames in .github/workflows/ci.yml.
PARTICLES (PlaxParticles, r41) is libGDX 1.14's ParticleEmitter, Sprite, MathUtils random (RandomXS128 in BigInt) and
sine table, ported in Java's float arithmetic: every float field through Math.fround, every (int) cast as |0. The
particles round compares the snow flake for flake (pixelsOff 0.05 %), seeded per scene as Round.seedRandom
(shots.js): one draw from the random more or less, or a float counted as a double where libGDX counts a float (r41: the
cross-fade's alpha ended the fade a step late, q04 t12 0.12 % off), and the snow diverges. A .p is fetched by
loadParticles(page, atlas) before setPage/transfertInto (bg.load does it). BREAK=hooks must FAIL effects;
BREAK=particles, anchor, blend must FAIL particles.
FLOOR, LURKER and the animated patch (r42) are PlaxFloor, PlaxLurker and PlaxAnim, from plax_floor.gd, plax_lurker.gd and
plax_anim.gd. act() plants the layers in front of a floor (l.planted) before it scrolls them, and runs the sightings
after every step; _drawLayer runs them again against its own view before a LURKER's alpha. A SHADER layer with a patch
draws it through a second Quads (l.animQuads, its own renderOrder after the layer's): PlaxAnim.apply gives that
material the frame's region, and this._part keeps the tiles (1) and the patches (2) apart in _tile. BREAK=plant must
FAIL floor, BREAK=lurker lurker, BREAK=anim animated.
THE DOLLY, TOWERS AND PLANETS (r43): _drawLayer gives each layer its own zoom (_zoomOf), corner (_anchorOf) and ppu,
then sets this._planet/_reach (PlaxPlanet) or this._panorama (PlaxPanorama, behind a near tower) that _drawRegion
reads: a planet piece is a quad of any shape (Quads.addCorners), a tower's or panorama's an axis-aligned one. A tower
piece's darkness is a per-corner colour (Quads.shade, the 'color' attribute every QuadRun carries, 1 elsewhere; the
effect shaders read it as vShade), packed as libGDX packs it (_towerShade: in the blue under the page fog). A
PARTICLES effect round a planet is turned as one block, in floats (PlaxPlanet.turn, PlaxParticles.draw). A hook draws
turned with batch.drawRegion(region, x, y, w, h, bg.planetPlaceAt(l, foot), bg.planetAngleAt(l, foot[0])).
BREAK=dolly must FAIL dolly, planet planet, shade and panorama tower.
THE GLINT, MIRROR AND DETAIL LEVELS (r44): glinted() in EFFECT_HEAD runs after every effect but PLAIN, its numbers set
by PlaxEffects._applyGlint, MIRROR's by _applyMirror (l.sky, l.zenith: the page's top gradient). PlaxDetail (plax_detail.gd)
puts l.shown, l.drawnEffect ('' drawn plain) and l.drawnGlint on each layer when it is built and when bg.detail,
setLayerDetail or setLayerDefaultDetail change; it swaps the quads' effect (Quads.setEffect), and code that asks
whether a SHADER layer draws its effect reads l.drawnEffect, never model.kind (pageFog, _part, update()'s animQuads).
BREAK=glint must FAIL glint, mirror shaders s12-s14, detail s15, s16, s18, g06 and g07 (tests/shots.js setDetails).
THE RINGS (PlaxRings, r48: the page as the sky of a 3D world, docs/page-as-3d-sky.md): its statics are core's
ParallaxRings line for line, checked as JSON by frame-check.sh's rings round (tests/rings.html, tools/compare-rings.py
within 1e-4); change core's and they change together. The instance draws them from PlaxBackground's state (layers,
distanceX, _alphaOf, tint), never its own loader: one Group, a band per layer turned by its scroll, depth tested and
never written, far first by renderOrder; the sky sphere and a still band follow the camera (_follow). Judged by eye in
tools/rings-lab.sh (--shot DIR, --clip F.mp4: headless on the GPU, fails on any console warning).
A bare rNN is a parallax-readers task; the mother board's are parallax:rNN.
"""

[tags.readers-health]
label = "Readers' dashboard"
description = "The readers' health dashboard: tools/readers-health.sh, tools/readers-health/ (health.py, health_test.py, serve.py), its board Site button, and the gates that run its tests"
color = "#ffc46b"
sort = 63
context = """
tools/readers-health.sh builds build/readers-health/index.html from what the readers' checks LEFT: each frame check's
report.txt under build/<reader>/<round>, JUnit, CI runs through gh, build/bench/<reader>.json. --run runs the checks first;
--serve 8797 serves it on loopback, rebuilt on each load: it is the board's Site button ([viewers.readers_health] in
atelier's projects/parallax-readers.toml, start runs in engines/, so the script is ../tools/readers-health.sh).
The feature table's <h2 id="features"> is a second Site button on both boards ([viewers.readers_features], url
/readers-health/#features; on parallax.toml start has no ../): keep the id, health_test.py checks it (r33).
tools/readers-health/health.py holds READERS (a new reader is an entry there), each reader's 'unsupported' entries
(naming the round, its task and the feature), the statuses (Stale, FAIL, no round) and the FEATURE TABLE (r28), judged
per reader from engines/rounds/features.json (feature -> scenes and *Cases). health_test.py covers the statuses and the
feature table: run python3 tools/readers-health/health_test.py after any health.py change.
A MUTANT RUN never becomes a verdict (r26): tools/shots-out.sh links it at build/<reader>/.mutant/<round>; the dashboard
reads build/<reader>/<round> only. engines/rounds/bench is timed, never compared: no frame check plays it, so it never
marks a reader Stale (r23). Relative paths given to its flags resolve against the caller's cwd (r24).
Readers today: libGDX (core/, the reference), jME (engines/jme, CI job jme-frames), Godot (engines/godot, godot-frames),
three.js (engines/threejs, threejs-frames).
Gates: the pre-commit hook runs tools/pre-commit-check.sh (CI's lint on the staged .py/.sh/.gd); CI is .github/workflows/ci.yml.
A bare rNN is a parallax-readers task; the mother board's are parallax:rNN.
"""
