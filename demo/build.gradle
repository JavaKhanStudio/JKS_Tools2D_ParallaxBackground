plugins {
    id 'application'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = ['assets']
    }
}

// The window icon is the editor's logo, the one README.md shows: one file, found on the classpath.
// The demo's pages are the showcase bank (demo/showcase, r108) and their atlases stay where the pages were made: both
// are put on the classpath rather than copied into assets/, where an internal file falls back to them.
tasks.named('processResources', ProcessResources) {
    from('../editor/assets/skins/uis/parallaxIcon.png')
    from('showcase') {
        include 'calm-day.jplax', 'calm-sunset.jplax', 'winter.jplax', 'spring.jplax', 'one-night.jplax', 'purple-fairy.jplax'
        into 'showcase'
    }
    from('../editor/Files/transfer') { include 'calm.atlas', 'calm.png', 'boss.atlas', 'boss.png' }
    from('../editor/Files/Demos') { include 'OneNight.atlas', 'OneNight.png', 'PurpleFairy.atlas', 'PurpleFairy.png' }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'jks.tools2d.parallax.demo.ParallaxDemo'
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

tasks.named('run', JavaExec) {
    workingDir = file('assets')
    rootProject.offscreen(it)
}

// ./gradlew :demo:stress --args="--layers 400 --repeat xy": frame time and GL counts of generated pages, see ParallaxStress.
tasks.register('stress', JavaExec) {
    group = 'application'
    description = 'Runs ParallaxStress: hundreds of generated layers, cross-faded, timed without vsync.'
    mainClass = 'jks.tools2d.parallax.demo.ParallaxStress'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = file('assets')
    rootProject.offscreen(it)
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs '-XstartOnFirstThread'
    }
}

// ./gradlew :demo:lab: the grading lab, the scenes of a round under demo/lab shown blind and graded 1-5, see ParallaxLab.
tasks.register('lab', JavaExec) {
    group = 'application'
    description = 'Runs ParallaxLab: grade the scenes of a round of demo/lab (the latest, or --args="demo/lab/roundN").'
    mainClass = 'jks.tools2d.parallax.demo.ParallaxLab'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootDir
    rootProject.offscreen(it)
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs '-XstartOnFirstThread'
    }
}
