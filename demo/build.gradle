plugins {
    id 'application'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = ['assets']
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'jks.tools2d.parallax.demo.ParallaxDemo'
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

tasks.named('run', JavaExec) {
    workingDir = file('assets')
}

// ./gradlew :demo:stress --args="--layers 400 --repeat xy": frame time and GL counts of generated pages, see ParallaxStress.
tasks.register('stress', JavaExec) {
    group = 'application'
    description = 'Runs ParallaxStress: hundreds of generated layers, cross-faded, timed without vsync.'
    mainClass = 'jks.tools2d.parallax.demo.ParallaxStress'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = file('assets')
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs '-XstartOnFirstThread'
    }
}
