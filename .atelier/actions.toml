# This board's ACTIONS — what it does often, one press away (atelier/actions.py in the atelier checkout).
# `run` is a script (no session, no tokens), `prompt` files a ticket.
# A script runs only once Simon has pressed Keep on the Actions tab.

[actions.demo-godot]
label = "Start the Godot demo"
about = "Opens engines/godot in a window on this machine's screen: Hiver drawn by the Godot reader, LEFT/RIGHT scroll. Needs godot 4.x on the PATH. Ends when you close the window."
run   = ["tools/start-demo.sh", "godot"]
