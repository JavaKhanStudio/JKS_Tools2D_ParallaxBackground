# parallax's TAGS AND THEIR CONTEXT PACKS — read by Atelier (projects/parallax.toml says
# packs = ".atelier/packs.toml"). A pack is what a session reads BEFORE the code it describes, so
# when a change makes one wrong, fix it here IN THE SAME COMMIT. Only [tags.<slug>]
# tables belong in this file: label, description, context, color, sort.

[tags.runtime]
visual = true          # a screen: its close needs a Chose: line (r1559, r1584)
label = "Runtime"
description = "core: scrolling, tiling, cross-fade, the gradient squares"
color = "#8fd0ff"
sort = 10
context = """
AGENTS.md's "Runtime (core)" section (read every session) holds each feature's rule and where its Godot and jME copies
live; SHADER effects and the page fog are #shader's. This is what it does not say.
Map: core/src/jks/tools2d/parallax/ParallaxPageReader (scroll, tile, fade, tint), ParallaxLayer (one layer's settings
and position), heart/Parallax_Heart (camera, batch, act/render), heart/Parallax_Utils_Page, side/SquareBackground.
ONE PAGE, TWO HEARTS (r298): getDrawing caches one list of layers, so a reader takes a page through layersOf, which
clones a layer another reader holds (ParallaxLayer.reader); a reader drops its own through clearLayers(), never
layers.clear(), or the next heart gets copies the editor's edits never reach (ParallaxHeartResizeTest). Hearts call only
getDrawing(relativePath, w, h): a stub overriding getDrawing() is ignored.
SHIPPED BROKEN, NOTHING FAILED: tiling ignored zoom and drew a tile past every row's right edge, 39% of draw calls
off-screen; repeatOnY and XY faded with 1 - alpha near a transfert's end; a page repeating on neither axis drew nothing;
a target page with more layers drew one twice at double opacity, with fewer it threw; incoming layers did not scroll
during the fade and jumped after it. `!Enum_TransfertType.NONE.equals(null)` is TRUE: ask `== null`.
So assert by counting and placing draws: the *Cases in core/browser-test/cases record them on RecordingBatch, no window
(BrowserSuiteTest loads the natives in @BeforeAll), every repeat mode, not only X.
The planet wraps every layer round ONE centre because r277's curve per layer pushed far layers under near ones and
Simon rejected it: a per-layer bend is not an option. Dolly: the effects keep the GAME's batch and setView, or FOG's
noise slides off its image.
README.md's layer-settings table is the documented meaning of each field: rename, rescale or repurpose one and fix it
in the same commit. MEMORY_LANE.md §5 is HISTORY at b5a7441: a defect you fix that it lists moves to its §10 table.
See it: tools/parallax-lab-shots.sh ROUND OUT (stills off screen), ./gradlew :jme:run, the editor repo's :demo:run.
"""

[tags.format]
label = "File format"
description = ".plax / .jplax / .plaxpj, the Kryo and JSON serializers, back-compat"
color = "#f2b263"
sort = 20
context = """
AGENTS.md (".plax is a file format", and "Browser" for clone()) lists every place a stored field goes (Kryo serializer behind a version bump,
Utils_Page_Json, plax_page.gd, buildFromPage, clone()) and the rules: prepareKryo append only, setReferences(true).
This is why they bite, and what it leaves out.
Every miss is SILENT. With setReferences off, every 2019 .plax decodes as garbage and throws nothing: the atlas comes back
"??????Hiver.atlas", the layer list empty (MEMORY_LANE.md §4; Kryo 5.0.0-RC1 wrote them with references on). A field the
browser's Utils_Page_Json or Godot's plax_page.gd does not name loads as its default. Parallax_Model_Serializer once
wrote flipX and never flipY: every vertically flipped layer came back unflipped, the reason for the version guard
`currentVersion(kryo) >= N`. Format 1 files (no version marker, the 2019-2023 editor) must keep loading.
Proof of a new field: PlaxFormatTest.assertPageEquals (JsonPageTest compares the JSON read with the Kryo one through it),
BuildFromPageTest, ParallaxLayerTest, and a scene using it in engines/rounds/conformance under
engines/godot/tools/frame-check.sh.
Files: core/src-jvm/jks/tools2d/parallax/pages/*_Serializer.java, pages/Json_MixIns.java (what Jackson skips),
heart/GVars_Serialization.java. A new src-jvm file is excluded by name in Parallax.gwt.xml; `:core:gwtCheck` fails if not.
Color_Serializer writes A, B, G, R. Deliberate now: leave it.
PlaxFormatTest reads the `parallax.repoRoot` property core/build.gradle sets: run from an IDE without it, it hunts for the
samples in the wrong folder. core/test-data/samples is the 2019 evidence: never re-export it to make a test pass.
A layer names its image by region name AND its position among same-named regions, never by name alone.
MEMORY_LANE.md is HISTORY at commit b5a7441, not a backlog: a defect you fix that it lists moves to its §10 table.
"""

[tags.assets]
label = "Images & atlas"
description = "Atlases, packing, flatten, loose PNGs, filtering"
color = "#7fd6a6"
sort = 40
context = """
The library's side of atlases; packing, flatten and export are the editor's (board parallax-editor, its #assets pack).
A page names its atlas BY FILE NAME, found next to the page (relativePath) through Gvars_Parallax's AssetManager. A layer
names a region by NAME + POSITION among same-named regions (index -1: a name used once). TexturePacker numbers files
from 1 (ground_1, ground_2), so "ground"+index and "ground"+position are two different keys.
The atlas's `filter:` line is what the game draws with: MipMapLinearLinear,Linear on power-of-two pages (GLES2/WebGL1 draw
a mipmapped NPOT page BLACK, a desktop shows nothing wrong), Nearest,Nearest for pixel art. Godot reads the same line
(engines/rounds/pixelart).
A mipmapped atlas needs each region's edges copied into its padding (the editor copies 25 of its 50 px): a tiled layer
drawn 1/m of its size with fewer than m texels copied shows a line at every join (r268, tools/r268-mip-seams). The
half-texel inset (r218) only saves a Linear atlas.
useOriginalSize: an atlas packed with whitespace stripped (non-zero `offset:` lines) draws its regions at their original
size only when the page says so.
ETC2 (r125, r173): Gvars_Parallax.setCompressedAtlases(on) loads <name>.etc2.atlas when it exists; supportsEtc2() is true
on OpenGL ES 3 only. pages/Utils_Etc2_Atlas loads the .zktx pages with their OWN mip levels: a compressed texture cannot
glGenerateMipmap, and libGDX's own TextureAtlas loader raises GL_INVALID_OPERATION there (emulator and Adreno 650, r206).
Fixtures core/test-data/etc2 (never re-exported), Etc2AtlasMipmapTest. tools/android-etc2-check.sh proves it on the
atelier-phone emulator; memory only on a Qualcomm phone (tools/android-etc2-memory.sh: Hiver 65.8 MiB PNG, 17.9 ETC2).
"""

# No `docs` tag (doubt d2, decision B, 2026-09-14): documentation work carries the tag of the
# area it documents. What the old pack said about README, MEMORY_LANE, RELEASING, NOTICE and
# javadoc now lives in the pack of the area each part mirrors — runtime, format, editor, build.
[tags.build]
label = "Build & release"
description = "Gradle, CI, dependency versions, Maven Central"
color = "#e8938f"
sort = 50
context = """
AGENTS.md (read every session) already holds the build's rules: every version in gradle.properties, core at release 11,
repositories in settings.gradle only, CI's gates and the git hooks. This is what it does not say.
Before a push, `./gradlew build` and `tools/browser-test.sh` are yours: no hook runs them. A red CI run comes back as a
#build task "CI red on <branch>": fix it before pushing more. A refused hook: fix the commit, never --no-verify.
INSIDE CAGE the agent-env rail is gone (cage hands its children its own variables). Never `env -u WAYLAND_DISPLAY` alone
there: GLFW 3.4 then tries wayland-0, Simon's gnome-shell, and 106 jME windows reached his screen that way (r234). Add
XDG_SESSION_TYPE=x11. A nested X server comes from tools/nested-x.sh (a fixed :9 broke two runs at once, r142); a lab's
open mode sources tools/agent-window-guard.sh, which refuses under ATELIER_AGENT or CLAUDECODE=1 (r237).
RELEASES follow RELEASING.md, never an invented procedure: develop (-SNAPSHOT, every push publishes one) -> release/X.Y
-> master, tagged vX.Y.Z; release.yml refuses a tag that disagrees with gradle.properties. A fix reaches a game as a
snapshot, not a release (Simon, r57): do not raise a release to ship one fix. Two artifacts share the version (r116):
parallax-background (:core) and parallax-background-jme (:jme, engines/jme/src is public API); both workflows publish both.
A tag push without the four Central secrets FAILS before building; only a hand-run Release with without_central skips
Central. Done means Central's maven-metadata.xml lists the version (minutes to an hour), not a green run.
README.md is the published front page: its module map and code map mirror the build (move a class or module, fix both in
the same commit), and its badges name ci.yml's FILE PATH and the Central coordinates: a rename breaks one silently.
NOTICE and README's Credits exist because "Cleaning house" (cd6ebc3, 2019) deleted the credit to Rahul Verma's
ParallaxBackground-libgdx, which Apache-2.0 requires: never trim them, keep inceptionYear 2014 in core/build.gradle.
Javadoc runs with Xdoclint:none (core/build.gradle): a broken tag does not fail the build. Read what you wrote.
"""

[tags.shader]
visual = true          # a screen: its close needs a Chose: line (r1559, r1584)
label = "Shader"
description = "SHADER layers' effects and the page's depth fog, in libGDX, Godot and jME"
color = "#c8a2f0"
sort = 15
context = """
EVERY EFFECT IS WRITTEN THREE TIMES, LINE FOR LINE: core/src/jks/tools2d/parallax/GdxLayerEffects.java (GLSL ES 1.0,
WebGL too), engines/godot/addons/jks_parallax/plax_effects.gd, engines/jme/resources/jks/tools2d/parallax/jme/
ParallaxEffect.frag (+ .j3md defines), all fed GdxLayerEffects.uniforms. AGENTS.md's Runtime section says which
transfert styles (dissolve, through a colour, fog creep) and seams (FOG's along()) also live in hazed().
The reader calls the engine's LayerEffects around a layer's tiles, NEVER Batch.setShader: JmeBatch.setShader throws, so
it works in libGDX and breaks every jME game. Enum_ShaderEffect is APPEND ONLY (stored by name since format 7).
PAGE FOG (format 10, r217): libGDX draws a fogged page's IMAGE and SEQUENCE layers through ONE PAGE_FOG shader, the
layer's fog in the batch colour's red and its page in the green (LayerEffects.beginPageFog): a flush per layer cost
0.08 ms CPU each on :demo:stress. The reader puts the tint back in the batch colour after each such layer: forget it and
the next SHADER layer draws black or red (PageFogCases.pageFogDrawsTheImageLayersInOneShaderTheirFogInTheBatchColor).
A tower's shade rides in that colour's blue (#runtime). Set uniforms by fetchUniformLocation(name, false): a by-name
setUniformf throws when a GPU drops one.
A Godot shader error is only a log line and the layer draws plain: read godot.log after a run (TAU is a Godot built-in;
that collision once moved the stills 2-11/255 with nothing failing).
Gates: both engines' tools/frame-check.sh on engines/rounds/shaders and engines/rounds/fog (fail past a mean 2/255). A
round only proves an effect that moves its stills by more: tools/r180-shader-round/strength.sh and
tools/r217-fog/strength.sh fail under 2.5/255; tools/r217-fog/mutate.sh fails unless the round sees a wrong copy.
GLINT (format 17, r427) is no effect but a layer's glintStrength: glinted() ends every effect before hazed(), in all
three copies. Its round, engines/rounds/glint, gates on pixelsOff, not the mean: the glint is sparse, and leaving it out
moves a still by under 1/255 (tools/r427-glint/strength.sh, mutate.sh). A glinting layer's period is at least FOG's.
"""

[tags.ai]
label = "AI pages"
description = "Painting a page's strips from a theme: tools/ai-page.sh, tools/r239-ai-strips (ai_page, gen, layer, sil, creature), animated layers. Cutting one painting by depth is #depth"
color = "#c99be0"
sort = 60
context = """
The parallax-pages skill's "Generating a page" says how to run ai-page.sh and what to look at; docs/ai-parallax.md why.
Map: ai_page.py drives it all (strips, cut, atlas, .jplax, lint, stills), gen.py paints (ComfyUI's nodes IN-PROCESS,
no server), sil.py the silhouette init, layer.py keys a strip against its sky, creature.py refuses figures.
gen.py is shared: tools/r279-depth-page runs it in a subprocess for its repaints, so a gen.py change is #depth's too.
ONE GPU, 8 GB, and two lanes (#ai, #depth) may run at once: tools/gpu_lock.py (r391) makes gen.py, anim.py and
depth_page's GPU steps take turns ("gpu_lock: waiting for the GPU (held by pid N ...)" in a log is a queue, not a hang;
ai_page's --timeout skips it). A new script that loads a model takes it too, round model load to decode, its memory
freed inside. Never stop another process to free the GPU. An OOM that does not scale with size is kept activations: an in-process script runs under
torch.inference_mode() (gen.py does; r375 lost an hour to its absence in anim.py).
A graded round may predate the fix it blames: r364 built a rule against ghosts R1's _cut.png showed, cut the evening
before r358 cleared them on HEAD. ls -l the artefacts against the fix's commit date, re-cut on HEAD first.
A hung strip is not a slow one: ai_page kills a command past --timeout (600 s) and retries once (r377); a dpmpp_sde
strip hung after step 1 with the GPU idle, once, not again in 100 runs since r391's lock: py-spy dumps a hung try's
stacks into <log>.hung.stack before the kill (r388), read it before guessing.
A key, layout or lint change bites a painting its ticket never named (r364, r382, r383, r398 each did): cut EVERY
painted strip again before and after, the before in a HEAD worktree, no GPU: tools/r364-ghosts/recut.sh LAYERPY OUT
over R1 (../JKS_Tools2D_ParallaxAI/build/rounds/r1/*/) and build/ai/examples/* (tools/r358-glow/recut.sh: the
examples only), then area.py BEFORE AFTER PAGE... (opaque px lost, largest hole opened: look at the worst) and
pair.py (painted / before / after, --behind over the layers behind). seam.py checks a strip's loop seam;
tools/parallax_lab.py lint PAGE the page's numbers. ../JKS_Tools2D_ParallaxAI is the parallax-ai board's own
repository: read its rounds, never edit it from here.
A pale far range SD paints round the shape (peaks between near slopes, a haze plain, a far pine in a V) is kept whole
and half clear (Simon's answer, r401): layer.far_range finds it against the top rows' sky, never local_sky's, which
takes its clear tops and keys it in blobs; layer.py --haze is its alpha.
A fix right for one model or one kind of layer only goes in layer.RULES (tools/parallax_rules.py, r400: misty_pines,
dreamshaper_8's pines only): conditions on --kind and --ckpt, which ai_page.py and both recut.sh pass, then a measure;
each strip's record lands in recipe.json's "rules", --rule NAME=on|off forces one. tools/r400-ai-rules/probe.py says
what each fix moves per model and kind; relay.sh re-lays a page with --keep (no GPU) for its before and after stills.
Gates: a layer_test.py case for the fault (python3 tools/r239-ai-strips/layer_test.py, no GPU), failing when the fix is
taken out (a rule's: tools/r400-ai-rules/mutate.sh); tools/r401-far-range/mutate.sh still passing (r401's, r382's and
r358's mutants, each must fail a test); tools/lint.sh (ruff, CI's pinned version); then the re-cut
corpus compared, and a page run's stills, looked at, before and after on the same --seed.
Clouds are never in another layer's sky (r409, the skill's rule 9): --clouds paints them on a strip of their own,
behind the back layer (sil.py's clouds, the theme kept out of the prompt: its palms grew in the clouds' sky);
cloud_strip_test.py, not layer_test.py, holds it (r358's and r400's mutants copy layer_test.py alone).
"""

[tags.depth]
label = "Depth pages"
description = "One flat painting cut into a page by its depth: tools/depth-page.sh, tools/r279-depth-page (bands, SAM outlines, fields, see-through, repaint)"
color = "#8fb3e0"
sort = 61
context = """
The parallax-pages skill's "From one painting (r279)" says how to run it and what each sheet shows;
docs/depth-tricks.md §5 why. Everything is tools/r279-depth-page/depth_page.py, run in the ComfyUI venv
(tools/depth-page.sh): Depth Anything V2 Small, depth bands, SAM 2.1 small's masks, then gen.py inpaint in a
subprocess for what each band hid. gen.py is #ai's file: change it and say so on the #ai lane's ticket.
ONE GPU, 8 GB, and two lanes (#ai, #depth) may run at once: depth_page's depth, masks and fields steps and gen.py
take tools/gpu_lock.py's lock (r391) and wait their turn ("gpu_lock: waiting" in the log). A new GPU step goes under
gpu_lock.held(), its model moved off the GPU before it ends; never round a gen() call (gen.py takes it: deadlock).
Every rule here was tuned on a few paintings (valley, river, noloop): a new rule can bring back an old fault on
another one (r386: r322's olive slab back on HEAD). Run the examples (tools/r279-depth-page/examples.sh) before
and after, in a HEAD worktree for the before, and compare them all, not only the painting the ticket names.
A metric must see the fault on the before image: tools/r279-depth-page/see_through.py OUT counts sky each layer
carries; a count that reads the same before and after proves nothing.
A fix right for one model or one kind of painting only goes in depth_page.RULES (tools/parallax_rules.py, r378):
named conditions asked in order, the cheap ones first, recorded per layer in recipe.json's "rules"; --rule NAME=on|off
forces one. Its cases go in tools/r279-depth-page/rules_test.py (no GPU), each check failing one when removed.
Look at OUT/cut/sheet.png, objects.png, fields.png AND the 6 and 12 s frames: a repaint shows only once layers slide.
When SAM finds clouds in the sky, the back band comes apart (r409): sky (filled, no repaint), clouds, and l0 the far
range cut along range_top; the page has --layers + 2 layers, named sky, clouds, l0... Its cases: clouds_test.py,
tools/r409-clouds/mutate.sh; replay.py cuts a cached painting (r380-twig-gaps/bands.py cache) with no GPU.
Gate: tools/lint.sh (ruff), rules_test.py, clouds_test.py, then the examples' stills, attached.
"""
