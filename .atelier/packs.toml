# parallax's TAGS AND THEIR CONTEXT PACKS — read by Atelier (projects/parallax.toml says
# packs = ".atelier/packs.toml"). A pack is what a session reads BEFORE the code it describes, so
# when a change makes one wrong, fix it here IN THE SAME COMMIT. Only [tags.<slug>]
# tables belong in this file: label, description, context, color, sort.

[tags.runtime]
label = "Runtime"
description = "core: scrolling, tiling, cross-fade, the gradient squares"
color = "#8fd0ff"
sort = 10
context = """
core/src/jks/tools2d/parallax/: ParallaxPageReader (scroll, tile, fade, tint), ParallaxLayer
(one layer's settings + position), heart/Parallax_Heart (camera, batch, act/render/resize/
dispose), heart/Parallax_Utils_Page (cross-fade), side/SquareBackground (the two gradients).
World size is PER HEART: each Parallax_Heart's ParallaxPageReader holds it and pushes it into
every layer it takes (setWorldSize). heart/Gvars_Parallax only holds the last heart's size, the
default (40 wide) for pages built without a heart: nothing a heart runs may read it.
ParallaxHeartResizeTest.twoHeartsKeepTheirOwnWorldSize holds that. A layer is worldWidth *
sizeRatio wide. Hearts call only getDrawing(relativePath, w, h): a stub overriding getDrawing() is ignored.
Gate: `./gradlew :core:test`. The reader's tests are core/browser-test/cases/.../ReaderCases
(GWT-safe: no JUnit, no reflection), run on the JVM by core/test BrowserSuiteTest and in Chrome by
tools/browser-test.sh. They need NO window: RecordingBatch records the draw calls, with
GdxNativesLoader.load() in BrowserSuiteTest's @BeforeAll. Assert tiling by counting and placing
draws — that is the tool, use it.
TILING MUST READ THE CAMERA VIEW (position AND zoom). The old code ignored zoom and drew one
extra tile past the right edge of every row: 39% of draw calls off-screen, no error anywhere.
`tilesJustEnoughToCoverTheView` is the test that holds that; keep it honest.
TEST EVERY REPEAT MODE, not just X. Only repeatOnX used the transfer opacity once; repeatOnY
and XY used an alpha that became `1 - alpha` near the end of a fade, and a page repeating on
NEITHER axis drew nothing at all.
Cross-fade edges, all of them already shipped broken: a target page with MORE layers looped
`i <= transferPosition` and drew one layer twice at double opacity; with FEWER it threw
IndexOutOfBounds; incoming layers did not scroll during the fade and jumped when it ended.
`!Enum_TransfertType.NONE.equals(null)` is TRUE — a null transfertType ran the transfer math
every frame forever. Ask `== null` deliberately.
act() and render() run every frame: no allocation, no streams. `layers.stream().forEach` in
act() is in MEMORY_LANE.md §5 as a defect, not as a style note.
See it: `tools/parallax-lab-shots.sh ROUND OUT` (stills of a round's pages, off screen; engines/godot/tests/transfer
for cross-fades), `./gradlew :jme:run`, or the editor repository's `./gradlew :demo:run`, which builds this core
when this checkout sits beside it.
THE GODOT PORT DRAWS THE SAME PAGE: engines/godot/addons/jks_parallax/plax_background.gd
copies act(), tile(), drawRegion() and the gradients line for line (r87), and the cross-fade,
syncTransferPositions and the tint (r94). Change how a page scrolls, tiles, fades or draws here and
change it there, or a Godot game shows a different picture: `tools/godot-parallax-shots.sh`
renders both off screen (libGDX's frames through shots/ ParallaxShots) and fails past a mean 2/255 apart; engines/godot/tests/transfer is its
cross-fade round. CI runs it too (ci.yml job godot-frames, Xvfb + llvmpipe): a push that
desynchronises the port fails the build, so run it before pushing, not after.
THE jME READER (engines/jme, r112) RUNS THIS CODE AS IS: PlaxBackground drives ParallaxPageReader
and draws through JmeBatch, a libGDX Batch in jME meshes that implements ONLY
draw(region, x, y, width, height) and throws on every other draw. Make the reader call another
Batch method, or change SquareBackground (ported in JmeGradient: it reads Gdx.graphics), and run
`tools/jme-parallax-shots.sh` (CI runs it after the Godot rounds, job godot-frames). No libGDX backend there: a core call that reaches a gdx
native from ParallaxPageReader or ParallaxLayer (OrthographicCamera.update -> Matrix4.prj does) throws
UnsatisfiedLinkError in a jME game.
SHADER LAYERS (r180, format 7) ARE AN IMAGE LAYER THROUGH AN EFFECT, WRITTEN THREE TIMES: core's
GdxLayerEffects (GLSL ES 1.0), Godot's plax_effects.gd, jME's resources/.../ParallaxEffect.frag, all fed
GdxLayerEffects.uniforms, the phase from the reader's clock. The reader calls the engine's LayerEffects around the
layer's tiles (jME's JmeLayerEffects -> JmeBatch.setEffect), never Batch.setShader. Change an effect, change all three
and run both frame checks on engines/godot/tests/shaders. A Godot shader error is only a log line and the layer
draws plain: the first shaders run differed by 2-11/255 for that (TAU is a Godot built-in), so read godot.log.
SEQUENCE LAYERS (r182, format 8) ARE A CYCLE DRAWN ONCE, THEN TILED: ParallaxLayer.sequence holds the segment regions
in texRegion (the first sets the height), a cycle int[N] picked by SequenceCycle and its edges in LAYER HEIGHTS (slot i
starts at height * cycleEdges[i] + i * padX), so act() and draw() recompute nothing; getTotalWidth() is the cycle.
drawCycle binary-searches the first slot in view. The generator is INTEGERS ONLY (xorshift32 13/17/5, (state >>> 1) %
total): a float rounds differently in GWT and GDScript. ReaderCases.sequenceCycleOfAKnownSeedIsPinned pins its picks;
Godot's port (r183: plax_page.gd draw_cycle, plax_background.gd _draw_cycle, GDScript ints 64-bit so every << masked
to 32 bits) matches them: engines/godot/tests/sequence_cycle.gd (the JVM's picks in tests/sequence/picks.json, and the
slots drawn against a walk over every slot) and the pixel round engines/godot/tests/sequence, which jME runs too. Change
the generator or drawCycle and change both, regenerate picks.json, run tools/r183-sequence/mutate.sh. A game's seed
(reader.setSequenceSeed, Godot set_sequence_seed) is XORed with each layer's stored one. A cycle no wider than 0 (pads
outweighing segments) can't tile and is drawn once, culled by its slots' real extent (getCycleLeft/Right, Godot
_cycle_left/_right), in both (r202; ReaderCases.sequenceWhosePadsOutweighItsSegmentsIsDrawnOnce, q04 'backward').
README.md's layer-settings table IS the documented meaning of these fields, and it is what a
game developer reads before depending on this. Rename, rescale or repurpose a setting and fix
the table in the SAME commit.
MEMORY_LANE.md §5 is the recorded history here — HISTORY, not a backlog. Its paths and
line numbers are commit 2a7e3f6 (`git show 2a7e3f6:<path>` shows the original), and
anything you fix that it still lists as broken MOVES into its §10 then/now table rather
than being deleted.
"""

[tags.format]
label = "File format"
description = ".plax / .jplax / .plaxpj, the Kryo and JSON serializers, back-compat"
color = "#f2b263"
sort = 20
context = """
core/src-jvm/jks/tools2d/parallax/pages/*_Serializer.java, pages/Utils_Page.java (load),
pages/Json_MixIns.java (what Jackson skips), heart/GVars_Serialization.java (the Kryo instance).
They live in src-jvm because core/src is translated by GWT (AGENTS.md, "Browser (GWT)"): no
Kryo or Jackson annotation goes on a model class, a new format file is excluded by name in
core/src/jks/tools2d/parallax/Parallax.gwt.xml, and `./gradlew :core:gwtCheck` fails if not.
NEVER REORDER THE REGISTRATIONS in GVars_Serialization.prepareKryo. Registration order IS
the class id written into every .plax ever exported (Color = 9, Parallax_Model = 10…).
Append only — the javadoc says so and it is the single most expensive rule here.
`kryo.setReferences(true)` MUST STAY. The files were written by Kryo 5.0.0-RC1, whose
default was on; Kryo 5.0 final turned it off. With it off, every existing .plax decodes as
garbage and throws NOTHING: the atlas name comes back "??????Hiver.atlas" and the layer list
empty. MEMORY_LANE.md §4 is the whole story — and it is HISTORY, not a backlog: its paths and
line numbers are commit 2a7e3f6, and anything you fix that it still lists as broken MOVES into
its §10 then/now table rather than being deleted.
New fields go behind a version bump, written AND read on the same branch, exactly like
flipY: `if (WholePage_Model_Serializer.currentVersion(kryo) >= 2)`. Format 1 files (the
2019-2023 editor) must keep loading — Parallax_Model_Serializer wrote flipX and never flipY,
so every vertically flipped layer came back unflipped.
A new stored field is ALSO read in core/src pages/Utils_Page_Json, the browser build's
loader (.jplax/.plaxpj through libGDX's JsonReader). It maps every field by hand, no
reflection: a field it does not name loads as its default in a browser game and throws
nothing. JsonPageTest compares it with the Kryo read through PlaxFormatTest.assertPageEquals,
so add the field there too.
A THIRD reader has the same blind spot: engines/godot/addons/jks_parallax/plax_page.gd (the
Godot port, r87) lists the layer fields in LAYER_DEFAULTS and reads the page's by hand. A
field missing there loads as its default in a Godot game. Add it, and a scene using it to
engines/godot/tests/conformance; `tools/godot-parallax-shots.sh` is the gate.
A layer field also lives on ParallaxLayer: setUpEverything copies it in, clone() copies it
(ParallaxLayerTest), and pages/Utils_Page.buildFromPage writes it back. That is the editor's
save path: a field it misses is dropped when the editor saves the page. BuildFromPageTest
round-trips a page through it.
Color_Serializer writes channels in A, B, G, R order. That is deliberate now; leave it.
Gate: `./gradlew :core:test`. PlaxFormatTest walks every .plax under core/test-data/samples
(byte copies of the 2019 editor's six and the demo's two, r130: core/test-data/samples/README.md
says where each came from) and checks it against the .plaxpj saved in the same 2019 session;
core/test-data/onboard holds copies of On Board's four pages for JsonPageTest. It reads the
`parallax.repoRoot` system property, which core/build.gradle sets — run the class straight
from an IDE without it and it hunts for samples in the wrong folder.
README.md's table of the three file formats mirrors these shapes; change what one holds and
fix the table in the SAME commit.
THE SAMPLE FILES ARE THE FIXTURES. Never re-export or overwrite core/test-data/samples, nor
their originals in the editor repository, to make a test pass: they are the 2019 evidence and the only proof the legacy path still works.
Shapes: .plax = Kryo binary (what games load), .jplax = JSON (what browser games load, and
tooling), .plaxpj = the editor
project. A page names its atlas BY FILE NAME; a layer names an image by region name AND its
position among the regions sharing that name — never by name alone.
"""

[tags.assets]
label = "Images & atlas"
description = "Atlases, packing, flatten, loose PNGs, filtering"
color = "#7fd6a6"
sort = 40
context = """
The library's side of atlases; packing, flatten and export are the editor's, on the
parallax-editor board (its #assets pack, in the editor repository's .atelier/packs.toml).
A page names its atlas BY FILE NAME and finds it next to the page (relativePath), through
Gvars_Parallax's AssetManager. A layer names a region by NAME + POSITION among same-named
regions; index -1 means a name used once. TexturePacker numbers files from 1 (ground_1,
ground_2), so "ground"+index and "ground"+position are two different keys.
The atlas file's `filter:` line is what the game draws with: the editor writes
MipMapLinearLinear,Linear on power-of-two pages (GLES2/WebGL1 draw a mipmapped NPOT page
black, desktop shows nothing wrong), Nearest,Nearest for a pixel-art project. The Godot reader
reads the same line (engines/godot/tests/pixelart).
useOriginalSize: an atlas packed with whitespace stripped (non-zero `offset:` lines) draws its
regions at their original size only when the page says so.
ETC2 (d13, r125, r173): Gvars_Parallax.setCompressedAtlases(on) makes atlasFile() load
<name>.etc2.atlas instead of <name>.atlas, when that copy exists; supportsEtc2() is true on
OpenGL ES 3 only (desktops unpack ETC2 to RGBA, browsers cannot read the gzipped pages).
pages/Utils_Etc2_Atlas loads its <name>_N.zktx pages with their OWN mip levels: a compressed
texture cannot glGenerateMipmap. Fixtures: core/test-data/etc2 (byte copies of an editor
export, never re-exported), Etc2AtlasMipmapTest. On Android (r140, the atelier-phone emulator,
GLES 3.1): tools/android-etc2-check.sh loads City PNG and ETC2 as a game does and fails on any
GL error; libGDX's own TextureAtlas loader still raises GL_INVALID_OPERATION from glGenerateMipmap
there, and on a real Adreno 650 (r206) too. The emulator cannot prove the memory (its host driver
unpacks ETC2): tools/android-etc2-memory.sh does on a Qualcomm phone, from the kgsl driver's
page_alloc (Samsung's GL mtrack leaves textures out): Hiver 65.8 MiB PNG, 17.9 MiB ETC2.
PIXMAPS AND TEXTURES ARE NATIVE MEMORY: dispose what you load; the AssetManager owns what it
loaded.
"""

# No `docs` tag (doubt d2, decision B, 2026-09-14): documentation work carries the tag of the
# area it documents. What the old pack said about README, MEMORY_LANE, RELEASING, NOTICE and
# javadoc now lives in the pack of the area each part mirrors — runtime, format, editor, build.
[tags.build]
label = "Build & release"
description = "Gradle, CI, dependency versions, Maven Central"
color = "#e8938f"
sort = 50
context = """
gradle.properties holds EVERY dependency version (gdx, lwjgl, kryo, jackson, gwt, junit, jme) and the
published `version`. Nothing pins a version inline; add new ones there.
build.gradle (root: encoding, lint, JUnit platform for all modules), core/build.gradle
(sources in src/ = GWT-translatable, src-jvm/ = Kryo/Jackson, test/; publishing; gwtCheck),
shots/build.gradle, engines/jme/build.gradle, settings.gradle, .github/workflows/{ci,release,snapshot}.yml, RELEASING.md.
core compiles to `options.release = 11` — games consume it, including on Android. Its tests,
shots and jme are 17. A Java 12+ API used in core/src fails the build with a
message about the API, never about the rule.
`repositoriesMode = FAIL_ON_PROJECT_REPOS` in settings.gradle: declaring a repository in a
module's build.gradle FAILS the build. Repositories go in settings.gradle only.
Gates, exactly what CI runs on JDK 17, 21 AND 25 (.github/workflows/ci.yml, job build):
  ./gradlew build                              compile + test everything, and :core:gwtCheck
                                               (GWT compiles core/src to JavaScript, ~20 s)
  tools/browser-test.sh                        the browser suite in headless Chrome (below)
and once, on JDK 17 (job godot-frames, xvfb-run + Mesa): tools/godot-parallax-shots.sh then
tools/jme-parallax-shots.sh, failing on a FAIL.
NO WINDOW ON SIMON'S SCREEN (r118, r144): every JavaExec task calls rootProject.offscreen(it) (it
opens a window: an agent's, ATELIER_AGENT or CLAUDECODE=1, goes to a headless cage, and fails
without cage) or rootProject.headless(it) (it opens none); gradle/offscreen.gradle stops the build
on one that does neither. A new module's `application` plugin makes a `run` task: wire it. A
script that opens a window runs it in cage (WLR_BACKENDS=headless) or through tools/offscreen.sh;
a nested X server inside cage comes from tools/nested-x.sh (a free display: a fixed :9 broke
two runs at once, r142).
tools/offscreen-lint.sh (CI, job build) fails a tools/*.sh that runs java, an installDist bin/,
godot or a browser without either, unless it carries `# on-screen: <why>` (r171). A java launch
that opens no window (a converter) passes with `# headless: <why>` on the line above it (r197).
The process-level rail under all of these (r118): .claude/settings.json gives every Claude session in
this checkout DISPLAY="" and WAYLAND_DISPLAY=no-screen-for-agents, so a launch that slips past them
FAILS ("Failed to open display") instead of popping up on Simon's desk. Cage needs neither. Do not
put the screen back in a session's env; when Simon asks to watch, prefix that one command with
DISPLAY=:0 WAYLAND_DISPLAY=wayland-0 ATELIER_NO_OFFSCREEN=1. tools/agent-screen-check.sh proves it.
Inside cage that rail is gone: cage hands its children its own variables. Never `env -u WAYLAND_DISPLAY`
alone there: GLFW 3.4 (LWJGL 3.3.6) then tries the default wayland-0, which is Simon's gnome-shell, and
106 jME windows reached his screen that way (r234). Add XDG_SESSION_TYPE=x11 to pick cage's nested X.
agent-screen-check.sh runs every such launch against a sentinel wayland-0 (--only-sentinel: that alone).
The labs' open mode (fog/haze/transfert-lab.sh with no argument, effects-lab.sh --lab L, browser-test.sh --open)
points Chrome at wayland-0 when the env has no display: tools/agent-window-guard.sh refuses it under ATELIER_AGENT
or CLAUDECODE=1 (r237). A new script that opens a window Simon asked for sources it the same way.
The editor and demo are another repository since the split (r130-r133, docs/repo-split.md):
JKS_Tools2D_ParallaxEditor, board parallax-editor. The library's gates read core/test-data
and draw their libGDX frames with :shots (shots/, ParallaxShots). The editor's build takes core
from Central, or builds this checkout's when it sits beside it: a core change shows in its
:editor:run without publishing. Its zip is released there, not here.
Releases: develop (always -SNAPSHOT, every push publishes one) → release/X.Y → master, tagged
vX.Y.Z. RELEASING.md is the procedure; follow it rather than inventing one. The release
workflow REFUSES to run when the tag and gradle.properties disagree.
Two artifacts share that version (r116): :core is parallax-background, :jme (engines/jme/src)
is parallax-background-jme, each with its own mavenPublishing block; the release and snapshot
workflows publish both. Its classes are public API. `./gradlew :core:publishToMavenLocal
:jme:publishToMavenLocal && ./gradlew -p tools/jme-probe run` proves a fresh jME game uses it.
A fix reaches a game as a snapshot, not a release (Simon, r57): push develop, and the game pins
the timestamped build (X.Y.Z-yyyyMMdd.HHmmss-N, RELEASING.md "Test versions"). Do not raise a
release to ship one fix. `./gradlew -p tools/snapshot-probe resolve` proves a snapshot resolves.
Browser suite (r68): tools/browser-test.sh builds :core:browserTestWar (GWT, ~20 s, not part of
`build`), serves it with python3 and runs it in headless Chrome; exit 1 unless every case passes.
Its cases (core/browser-test/cases) also run on the JVM in :core:test (BrowserSuiteTest).
Maven Central needs four repository secrets (MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
SIGNING_KEY, SIGNING_KEY_PASSWORD; all four are set). Without them a tag push FAILS before
building anything; only a hand-run Release with `without_central` ticked skips Central, and
says so in the run summary. Central then takes minutes to an hour: done means
https://repo1.maven.org/maven2/io/github/javakhanstudio/parallax-background/maven-metadata.xml
lists the version, not a green run.
README.md IS THE PUBLISHED FRONT PAGE and it is accurate today — keep it that way. Its module
map and the code map at the end mirror this build: move a class or a module and fix both in the
SAME commit. Its badges point at the CI workflow FILE PATH and at the Central artifact
coordinates, so renaming either breaks a badge silently, visible only on the GitHub page.
NOTICE and the README's Credits section exist because "Cleaning house" (f29c6e3, 2019-04-28)
deleted the credit to Rahul Verma's ParallaxBackground-libgdx, which Apache-2.0 REQUIRES. Never
trim them, and keep the 2014 inceptionYear in core/build.gradle's pom.
Javadoc runs with `Xdoclint:none` (core/build.gradle), so a broken or missing tag will NOT fail
the build. Read what you wrote; nothing else will.
"""

[tags.shader]
label = "Shader"
description = "SHADER layers' effects and the page's depth fog, in libGDX, Godot and jME"
color = "#c8a2f0"
sort = 15
context = """
EVERY EFFECT IS WRITTEN THREE TIMES, LINE FOR LINE: core/src/jks/tools2d/parallax/GdxLayerEffects.java (GLSL ES 1.0,
WebGL too), engines/godot/addons/jks_parallax/plax_effects.gd, engines/jme/resources/jks/tools2d/parallax/jme/
ParallaxEffect.frag (+ .j3md defines), all fed GdxLayerEffects.uniforms. Change one, change all three.
The reader calls the engine's LayerEffects (core/src/.../LayerEffects.java, jME's JmeLayerEffects) around a layer's
tiles, NEVER Batch.setShader: JmeBatch.setShader throws, so it works in libGDX and breaks every jME game.
Enum_ShaderEffect is APPEND ONLY (stored by name since format 7); a new effect also goes in plax_effects.gd's EFFECTS
and in the round engines/godot/tests/shaders.
PAGE FOG (fogStrength, fogColor, format 10, r217; format 9's FOG-layer shaderHaze is read as its strength): every
shader above ends in hazed() toward u_fog, and an IMAGE or SEQUENCE layer is drawn through a PLAIN one in jME (Plain
define) and Godot ("PLAIN" material). libGDX draws them through ONE PAGE_FOG shader, the layer's fog in the batch
colour's red and its page in the green (LayerEffects.beginPageFog): a flush per layer cost 0.08 ms CPU each on
:demo:stress. The reader puts the tint back in the batch colour after each such layer: forget it and the next SHADER
layer draws black or red (ReaderCases.pageFogDrawsTheImageLayersInOneShaderTheirFogInTheBatchColor). Set uniforms by
fetchUniformLocation(name, false): a by-name setUniformf throws when a GPU drops one. ParallaxPageReader.fogOf and
frontSpeedOf are copied in plax_effects.gd fog_of / front_speed_of. Change one, change the other.
A Godot shader error is only a log line and the layer draws plain: read godot.log after a run (TAU is a Godot
built-in; that name collision once moved the stills 2-11/255 with nothing failing).
Gates: tools/godot-parallax-shots.sh and tools/jme-parallax-shots.sh, given engines/godot/tests/shaders
engines/godot/tests/fog as arguments (no argument runs every round; both fail past a mean 2/255; CI's godot-frames job runs them). A round only proves an
effect that moves its stills by more than that: tools/r180-shader-round/strength.sh (effects) and
tools/r217-fog/strength.sh (fog) fail under 2.5/255, and tools/r217-fog/mutate.sh puts a wrong fog in one engine at a
time and fails unless the fog round does. A new effect or a weaker scene: run them.
A new stored field is a format bump: the format, browser JSON and Godot readers (AGENTS.md ".plax is a file format").
"""
