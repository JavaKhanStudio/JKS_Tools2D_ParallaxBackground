[tags.build]
label = "Build & release"
description = "Gradle, CI, dependency versions, Maven Central"
color = "#e8938f"
sort = 50
context = """
AGENTS.md (read every session) already holds the build's rules: every version in gradle.properties, core at release 11,
repositories in settings.gradle only, CI's gates and the git hooks. This is what it does not say.
Before a push, `./gradlew build` and `tools/browser-test.sh` are yours: no hook runs them. A red CI run comes back as a
#build task "CI red on <branch>": fix it before pushing more. A refused hook: fix the commit, never --no-verify.
INSIDE CAGE the agent-env rail is gone (cage hands its children its own variables). Never `env -u WAYLAND_DISPLAY` alone
there: GLFW 3.4 then tries wayland-0, Simon's gnome-shell, and 106 jME windows reached his screen that way (r234). Add
XDG_SESSION_TYPE=x11. A nested X server comes from tools/nested-x.sh (a fixed :9 broke two runs at once, r142); a lab's
open mode sources tools/agent-window-guard.sh, which refuses under ATELIER_AGENT or CLAUDECODE=1 (r237).
RELEASES follow RELEASING.md, never an invented procedure: develop (-SNAPSHOT, every push publishes one) -> release/X.Y
-> master, tagged vX.Y.Z; release.yml refuses a tag that disagrees with gradle.properties. A fix reaches a game as a
snapshot, not a release (Simon, r57): do not raise a release to ship one fix. Two artifacts share the version (r116):
parallax-background (:core) and parallax-background-jme (:jme, engines/jme/src is public API); both workflows publish both.
A tag push without the four Central secrets FAILS before building; only a hand-run Release with without_central skips
Central. Done means Central's maven-metadata.xml lists the version (minutes to an hour), not a green run.
README.md is the published front page: its module map and code map mirror the build (move a class or module, fix both in
the same commit), and its badges name ci.yml's FILE PATH and the Central coordinates: a rename breaks one silently.
NOTICE and README's Credits exist because "Cleaning house" (cd6ebc3, 2019) deleted the credit to Rahul Verma's
ParallaxBackground-libgdx, which Apache-2.0 requires: never trim them, keep inceptionYear 2014 in core/build.gradle.
Javadoc runs with Xdoclint:none (core/build.gradle): a broken tag does not fail the build. Read what you wrote.
"""

[tags.shader]
visual = true          # a screen: its close needs a Chose: line (r1559, r1584)
label = "Shader"
description = "SHADER layers' effects and the page's depth fog, in libGDX, Godot and jME"
color = "#c8a2f0"
sort = 15
context = """
EVERY EFFECT IS WRITTEN THREE TIMES, LINE FOR LINE: core/src/jks/tools2d/parallax/GdxLayerEffects.java (GLSL ES 1.0,
WebGL too), engines/godot/addons/jks_parallax/plax_effects.gd, engines/jme/resources/jks/tools2d/parallax/jme/
ParallaxEffect.frag (+ .j3md defines), all fed GdxLayerEffects.uniforms. AGENTS.md's Runtime section says which
transfert styles (dissolve, through a colour, fog creep) and seams (FOG's along()) also live in hazed().
The reader calls the engine's LayerEffects around a layer's tiles, NEVER Batch.setShader: JmeBatch.setShader throws, so
it works in libGDX and breaks every jME game. Enum_ShaderEffect is APPEND ONLY (stored by name since format 7).
PAGE FOG (format 10, r217): libGDX draws a fogged page's IMAGE and SEQUENCE layers through ONE PAGE_FOG shader, the
layer's fog in the batch colour's red and its page in the green (LayerEffects.beginPageFog): a flush per layer cost
0.08 ms CPU each on :demo:stress. The reader puts the tint back in the batch colour after each such layer: forget it and
the next SHADER layer draws black or red (PageFogCases.pageFogDrawsTheImageLayersInOneShaderTheirFogInTheBatchColor).
A tower's shade rides in that colour's blue (#runtime). Set uniforms by fetchUniformLocation(name, false): a by-name
setUniformf throws when a GPU drops one.
A Godot shader error is only a log line and the layer draws plain: read godot.log after a run (TAU is a Godot built-in;
that collision once moved the stills 2-11/255 with nothing failing).
Gates: both engines' tools/frame-check.sh on engines/rounds/shaders and engines/rounds/fog (fail past a mean 2/255). A
round only proves an effect that moves its stills by more: tools/r180-shader-round/strength.sh and
tools/r217-fog/strength.sh fail under 2.5/255; tools/r217-fog/mutate.sh fails unless the round sees a wrong copy.
"""
