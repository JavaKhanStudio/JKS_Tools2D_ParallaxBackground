dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'JKS_Tools2D_ParallaxBackground'

include 'core'

// The editor and the demo are JKS_Tools2D_ParallaxEditor, a repository of their own since the split (r130-r133,
// docs/repo-split.md): it takes core from Maven Central, or from this checkout when it sits beside it.

// The reference renderer (r130): the libGDX frames tools/parallax-lab-shots.sh draws for the reader rounds.
include 'shots'

// The jMonkeyEngine reader (r112): a Java engine, so it draws pages with core itself.
include 'jme'
project(':jme').projectDir = file('engines/jme')
