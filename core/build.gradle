plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

// The jar is named after the published artifact, not after the module folder.
base {
    archivesName = 'parallax-background'
}

// Runtime library used by games: keep the bytecode level low enough for Android/desktop consumers.
tasks.named('compileJava', JavaCompile) {
    options.release = 11
}
tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
}

/*
 * src      translatable by GWT: what a browser game compiles to JavaScript (src/jks/tools2d/parallax/Parallax.gwt.xml).
 * src-jvm  same packages, same jar, JVM only: reading and writing .plax (Kryo) and .jplax (Jackson).
 * gwtCheck below proves the split holds.
 */
sourceSets {
    main {
        java.srcDirs = ['src', 'src-jvm']
        resources.srcDirs = ['src']
        resources.includes = ['**/*.gwt.xml']
    }
    test.java.srcDirs = ['test']
}

configurations {
    gwtCheck
}

// The sources jar is what GWT compiles a game from: src is both a Java and a resource folder, Parallax.gwt.xml goes in once.
tasks.withType(Jar).matching { it.name == 'sourcesJar' }.configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.esotericsoftware:kryo:$kryoVersion"
    // Only the annotations: games reading .plax files never need jackson-databind at runtime.
    api platform("com.fasterxml.jackson:jackson-bom:$jacksonVersion")
    api 'com.fasterxml.jackson.core:jackson-annotations'

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // GWT compiles Java source: the libGDX jars come with their sources.
    gwtCheck "org.gwtproject:gwt-dev:$gwtVersion"
    gwtCheck "org.gwtproject:gwt-user:$gwtVersion"
    gwtCheck "com.badlogicgames.gdx:gdx:$gdxVersion"
    gwtCheck "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
    gwtCheck "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
    gwtCheck "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
}

tasks.named('test', Test) {
    // Tests read the sample .plax/.plaxpj files shipped with the editor and the demo.
    systemProperty 'parallax.repoRoot', rootDir.absolutePath
}

/*
 * Compiles gwt-check/ (a game inheriting jks.tools2d.parallax.Parallax) to JavaScript. -strict fails on any unit of the
 * module that does not translate, reached or not: a Kryo, Jackson or Java-only API in src, or a src-jvm file that
 * Parallax.gwt.xml does not exclude. Part of `check`, so of `./gradlew build` and CI.
 */
def gwtCheck = tasks.register('gwtCheck', JavaExec) {
    group = 'verification'
    description = 'Proves core/src translates to JavaScript with GWT, the way a browser game inherits it.'
    def war = layout.buildDirectory.dir('gwtCheck/war')
    def work = layout.buildDirectory.dir('gwtCheck/work')
    inputs.files(fileTree('src'), fileTree('src-jvm'), fileTree('gwt-check')).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(configurations.gwtCheck)
    outputs.dir(war)
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = files('gwt-check', 'src', 'src-jvm') + configurations.gwtCheck
    maxHeapSize = '1g'
    argumentProviders.add({ ['-strict', '-draftCompile', '-failOnError', '-logLevel', 'ERROR',
            '-war', war.get().asFile.absolutePath, '-workDir', work.get().asFile.absolutePath,
            'jks.tools2d.parallax.gwtcheck.ParallaxGwtCheck'] } as CommandLineArgumentProvider)
    doFirst { delete war, work }
}
tasks.named('check') {
    dependsOn gwtCheck
}

// Javadoc of a libGDX library: don't fail the build on missing tags.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

/*
 * Publishing:
 *   ./gradlew :core:publishToMavenLocal          local testing
 *   ./gradlew :core:publishToMavenCentral        release or snapshot (CI does this, see .github/workflows)
 * Credentials come from the environment, see RELEASING.md.
 */
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates(project.group.toString(), 'parallax-background', project.version.toString())

    pom {
        name = 'JKS Tools2D Parallax Background'
        description = 'Parallax background library for libGDX games, with a desktop editor to design the backgrounds.'
        url = 'https://github.com/JavaKhanStudio/JKS_Tools2D_ParallaxBackground'
        inceptionYear = '2014'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'JavaKhanStudio'
                name = 'Simon Bedard'
                url = 'https://github.com/JavaKhanStudio'
            }
        }
        scm {
            url = 'https://github.com/JavaKhanStudio/JKS_Tools2D_ParallaxBackground'
            connection = 'scm:git:https://github.com/JavaKhanStudio/JKS_Tools2D_ParallaxBackground.git'
            developerConnection = 'scm:git:ssh://git@github.com/JavaKhanStudio/JKS_Tools2D_ParallaxBackground.git'
        }
    }
}
