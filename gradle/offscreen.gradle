// Offscreen for a board agent: the windows nobody is meant to watch get a display of their own (r118, after
// ~/Documents/GitHub/onboard's gradle/offscreen.gradle).
//
// An agent checking its work ran :editor:run, :demo:run or :jme:run (the editor and demo are another repository since
// r133), and each opened a window on Simon's desktop, in front of whatever he was doing. tools/*-shots.sh already ran
// in cage, a headless wlroots compositor; the Gradle tasks did not.
//
//   offscreen(task)   offscreen for an agent: ATELIER_AGENT set (a board session) or CLAUDECODE=1 (any Claude Code
//                     session, including one that unset ATELIER_AGENT); on the screen for anyone else, including the
//                     board's "Start the demo" buttons (tools/start-demo.sh does not go through these tasks)
//   headless(task)    a JavaExec that opens no window (a compiler, a fixture writer)
//
// Every JavaExec task of the build is one or the other, or the build stops before running anything (r144): a new
// module's `run` task (the application plugin makes one) is exactly how :shots:run reached r130 unwired.
//
// ATELIER_NO_OFFSCREEN=1 puts the window back when Simon asked to watch (the tools/ scripts read the same variable);
// ATELIER_OFFSCREEN=1 sends it offscreen for you too. An agent without cage FAILS rather than open the window on
// Simon's screen; anyone else without cage (Windows, macOS) gets the window as always.
//
// cage's headless display renders on another GPU than the desktop on Simon's laptop (NVIDIA, the desktop's windows
// Intel): compare frame times of the same one.
//
// Nothing here is a test: core's tests draw nothing (a proxied Batch) and tools/browser-test.sh is headless Chrome.

import java.util.concurrent.CompletableFuture
import java.util.concurrent.TimeUnit

import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

abstract class OffscreenDisplay implements BuildService<BuildServiceParameters.None>, AutoCloseable
{
	private Process cage
	private Map<String, String> display
	private String failure

	/**
	 * WAYLAND_DISPLAY and DISPLAY of a headless cage, started on first use and closed when the build ends. Null when
	 * there is no cage; throws when cage exists but will not come up, rather than fall back to Simon's screen.
	 */
	synchronized Map<String, String> display()
	{
		if (failure != null) throw new GradleException(failure)
		if (cage != null) return display

		// cage runs one client and exits with it: this one prints the display cage made for it and waits on stdin, so
		// cage lives until close() hangs up, or until the Gradle daemon dies and the pipe closes the same way.
		ProcessBuilder pb = new ProcessBuilder('cage', '--', 'sh', '-c',
			'printf "%s|%s\\n" "$WAYLAND_DISPLAY" "$DISPLAY"; exec cat >/dev/null')
		pb.environment().put('WLR_BACKENDS', 'headless')
		pb.redirectError(ProcessBuilder.Redirect.DISCARD)
		try
		{
			cage = pb.start()
		}
		catch (IOException ignored)
		{
			return null
		}

		BufferedReader out = new BufferedReader(new InputStreamReader(cage.inputStream))
		String line = null
		try
		{
			line = CompletableFuture.supplyAsync { out.readLine() }.get(15, TimeUnit.SECONDS)
		}
		catch (Exception ignored) {}

		String[] parts = line?.split('\\|', -1)
		if (parts == null || parts.length != 2 || !parts[0] || !parts[1])
		{
			close()
			failure = 'cage is installed but did not start a headless display (got ' + line + '). ' +
				'Set ATELIER_NO_OFFSCREEN=1 to open the window on your screen instead.'
			throw new GradleException(failure)
		}
		display = [WAYLAND_DISPLAY: parts[0], DISPLAY: parts[1]]
		return display
	}

	@Override
	void close()
	{
		if (cage == null) return
		try { cage.outputStream.close() } catch (IOException ignored) {}
		if (!cage.waitFor(5, TimeUnit.SECONDS)) cage.destroyForcibly()
	}
}

def offscreenDisplay = gradle.sharedServices.registerIfAbsent('parallaxOffscreenDisplay', OffscreenDisplay) {}

ext.offscreen = { JavaExec task ->
	task.ext.offscreenChecked = 'offscreen'
	task.usesService(offscreenDisplay)
	task.doFirst {
		def env = System.getenv()
		if (env.ATELIER_NO_OFFSCREEN == '1') return
		boolean agent = env.ATELIER_AGENT || env.CLAUDECODE == '1'
		if (!agent && env.ATELIER_OFFSCREEN != '1') return
		if (!System.getProperty('os.name').toLowerCase().contains('linux'))
		{
			if (agent)
				throw new GradleException("offscreen: ${task.path} would open its window on the screen (no cage here). " +
					'Set ATELIER_NO_OFFSCREEN=1 only when Simon asked to watch it.')
			return
		}

		Map<String, String> display = offscreenDisplay.get().display()
		if (display == null)
			throw new GradleException("offscreen: cage not found, and ${task.path} would open its window on your screen. " +
				'Install cage (dnf install cage), or set ATELIER_NO_OFFSCREEN=1 to watch it.')
		// Both: GLFW picks Wayland or X11 (cage's Xwayland) by itself.
		task.environment(display)
		task.environment(ALSOFT_DRIVERS: 'null')
		task.logger.lifecycle("offscreen: ${task.path} renders to a headless display " +
			"(cage, ${display.WAYLAND_DISPLAY} / ${display.DISPLAY}); ATELIER_NO_OFFSCREEN=1 to watch")
	}
}

ext.headless = { JavaExec task ->
	task.ext.offscreenChecked = 'headless'
}

// Every JavaExec says which it is (r144). Realizing them here runs their configuration, where offscreen/headless is
// called; the nine of this build cost nothing.
gradle.projectsEvaluated {
	List<String> unchecked = []
	rootProject.allprojects { p ->
		p.tasks.withType(JavaExec).toList().each { t ->
			if (!t.ext.has('offscreenChecked'))
				unchecked << t.path
		}
	}
	if (unchecked)
		throw new GradleException("${unchecked.join(', ')}: a JavaExec that is neither rootProject.offscreen(it) (it may " +
			"open a window: an agent's goes to cage) nor rootProject.headless(it) (it opens none). See gradle/offscreen.gradle.")
}
